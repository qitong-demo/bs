server:
  port: 8080

spring:
  application:
    name: friendly-station-platform
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # 邮件服务：用于发送邮箱验证码（改账号 ID / 改密码 / 改联系方式）。
  # 为什么不用短信：个人开发者申请不到短信资质（阿里云 2025-06-06 公告明确
  # 「短信服务不支持申请个人自用资质」），邮箱是能真实送达的唯一验证通道。
  #
  # 账号密码全部通过环境变量注入，绝不入库。
  # **未配置时不会假装成功**：验证码只写后端日志，接口返回 delivered=false，
  # 前端据此显著标注「演示环境未真实发送邮件」。
  # 本地想真发：MAIL_HOST=smtp.qq.com MAIL_USERNAME=你的邮箱 MAIL_PASSWORD=SMTP授权码
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    token-prefix: Bearer
    jwt-secret: friendly-station-demo-secret-key-at-least-32-bytes
    token-expire-minutes: 120

# 高德地图 Web 服务（服务端调用，Key 绝不进前端）。
# 通过环境变量 AMAP_WEB_KEY 注入；未配置时「按坐标定位用户城市」接口返回 null，
# 前端会自动回退到平台默认城市，不影响其他功能。
amap:
  web-key: ${AMAP_WEB_KEY:}
  base-url: https://restapi.amap.com
  timeout-seconds: 5

# 接口文档：/v3/api-docs 为 OpenAPI 描述，/swagger-ui.html 为可视化调试页面。
# 导出脚本 scripts/export-openapi.ps1 会拉取该描述并生成 docs/接口文档.md。
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
